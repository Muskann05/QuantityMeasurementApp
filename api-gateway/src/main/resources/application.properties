# ================= BASIC =================
spring.application.name=api-gateway
server.port=8080

# ================= EUREKA =================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ================= GATEWAY =================
spring.cloud.gateway.discovery.locator.enabled=true

# ================= ROUTES =================

# USER SERVICE
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/users/**

# MEASUREMENT SERVICE
spring.cloud.gateway.routes[1].id=measurement-service
spring.cloud.gateway.routes[1].uri=lb://measurement-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/quantities/**

# HISTORY SERVICE
spring.cloud.gateway.routes[2].id=history-service
spring.cloud.gateway.routes[2].uri=lb://history-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/history/**

# ================= CORS =================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*

# ================= DEBUG =================
logging.level.org.springframework.cloud.gateway=DEBUG
spring.main.allow-bean-definition-overriding=true